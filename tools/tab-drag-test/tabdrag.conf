# Minimal config for the headless tab-drag test. Explicit groupbar geometry so the
# test can compute tab positions instead of guessing.

monitor = HEADLESS-1, 1920x1080@60, 0x0, 1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    resize_on_border = false
}

group {
    groupbar {
        enabled = true
        height = 20
        indicator_height = 3
        indicator_gap = 0
        gaps_in = 2
        gaps_out = 2
        keep_upper_gap = true
        render_titles = true
        stacked = false
        drag_tabs = true
    }
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

debug {
    enable_stdout_logs = false
}
